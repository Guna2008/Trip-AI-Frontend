<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Trip | Trip AI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="trip-page">

        <header class="dashboard-header">

            <div class="logo">
                Trip AI
            </div>

            <button
                id="logoutBtn"
                class="secondary-button"
            >
                Logout
            </button>

        </header>


        <section class="trip-content">

            <div class="trip-header">

                <h1>Create a Trip</h1>

                <p>
                    Tell us where you want to go and what you are interested in.
                    AI will create your itinerary.
                </p>

            </div>


            <div class="trip-card">

                <form id="tripForm">

                    <div class="form-group">

                        <label for="destination">
                            Destination
                        </label>

                        <input
                            type="text"
                            id="destination"
                            name="destination"
                            placeholder="e.g. Chennai"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="days">
                            Number of Days
                        </label>

                        <input
                            type="number"
                            id="days"
                            name="days"
                            min="1"
                            placeholder="e.g. 5"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="interests">
                            Interests
                        </label>

                        <input
                            type="text"
                            id="interests"
                            name="interests"
                            placeholder="e.g. beaches, food, history"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Generate Trip
                    </button>

                </form>


                <p
                    id="tripMessage"
                    class="message"
                ></p>

            </div>


            <section
                id="tripResult"
                class="trip-result"
            ></section>

        </section>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
