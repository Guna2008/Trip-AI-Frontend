<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Trip AI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="dashboard-page">

        <header class="dashboard-header">

            <div class="logo">
                Trip AI
            </div>

            <button
                id="logoutBtn"
                class="secondary-button"
            >
                Logout
            </button>

        </header>


        <section class="dashboard-content">

            <div class="dashboard-intro">

                <h1>Plan your next trip</h1>

                <p>
                    Create AI-powered travel plans based on your destination,
                    interests, and number of days.
                </p>

            </div>


            <div class="dashboard-actions">

                <a
                    href="create-trip.html"
                    class="dashboard-card"
                >
                    <h2>Create a Trip</h2>

                    <p>
                        Generate a personalized travel itinerary using AI.
                    </p>
                </a>


                <a
                    href="my-trips.html"
                    class="dashboard-card"
                >
                    <h2>My Trips</h2>

                    <p>
                        View and manage your previously generated trips.
                    </p>
                </a>

            </div>

        </section>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
